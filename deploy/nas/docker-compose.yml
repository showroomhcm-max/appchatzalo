# Chat Siêu Tốc trên Synology NAS (Container Manager › Dự án).
# Thư mục trên NAS:
#   chat-sieutoc/
#     docker-compose.yml   ← file này
#     cap-nhat.sh          ← tự cập nhật bản mới (Bộ lập lịch tác vụ của DSM chạy vài phút một lần)
#     ghcr.env             ← GHCR_USER / GHCR_TOKEN: mã chỉ-đọc để tải bản build từ GitHub
#     data/                ← CSDL, ảnh, file (KHÔNG xoá)
#     app.env              ← cấu hình app (bản sao .env)
#     tunnel.env           ← TUNNEL_TOKEN=... của Cloudflare Tunnel
# App và tunnel dùng chung một mạng riêng (do container "net" giữ), nên tunnel gọi app qua
# localhost:3000 như khi chạy trên laptop mà không đụng cổng 3000 của NAS (app khác trên NAS
# dùng cổng đó cũng không sao). "net" chỉ ngủ, không bao giờ khởi động lại, để app hay tunnel
# có khởi động lại thì mạng chung vẫn còn.
name: chat-sieutoc

services:
  net:
    image: node:24-slim
    container_name: chat-sieutoc-net
    command: ["sleep", "infinity"]
    init: true
    ports:
      - "3100:3000" # mở trong mạng nội bộ: http://<IP-NAS>:3100 (đổi số 3100 nếu NAS đã dùng)
    restart: unless-stopped

  app:
    # Bản build sẵn trên GitHub; muốn giữ một bản cố định thì đặt APP_TAG=3.15.5 trong file .env cạnh file này.
    image: ghcr.io/sieutoccorp/chatcskh:${APP_TAG:-latest}
    container_name: chat-sieutoc
    network_mode: service:net
    depends_on: [net]
    env_file: app.env
    environment:
      DATA_DIR: /app/data
      PORT: "3000"
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./data:/app/data
    mem_limit: 3g
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    container_name: chat-sieutoc-tunnel
    network_mode: service:net
    command: tunnel --no-autoupdate run
    env_file: tunnel.env
    depends_on: [net, app]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
