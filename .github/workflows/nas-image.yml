# Mỗi lần phát hành (tag v*), build ảnh Docker và đẩy lên GitHub Container Registry.
# NAS (deploy/nas/cap-nhat.sh) thấy ảnh mới thì tự cập nhật.
name: Build ảnh cho NAS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Code được đẩy lên 2 repo; chỉ build ở repo công ty, và chỉ từ tag phát hành v* (chạy tay cũng phải chọn tag):
    # NAS tự cài bản :latest nên không để nhánh chưa phát hành đẩy được ảnh lên.
    if: github.repository == 'SieuTocCorp/chatcskh' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/sieutoccorp/chatcskh:latest
            ghcr.io/sieutoccorp/chatcskh:${{ steps.v.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
